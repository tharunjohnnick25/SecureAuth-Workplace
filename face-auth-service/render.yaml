services:
  - type: web
    name: secureauth-face-service
    runtime: python
    repo: https://github.com/your-username/your-repo
    rootDir: face-auth-service
    plan: free
    envVars:
      - key: FACE_SERVICE_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FACE_MATCH_THRESHOLD
        value: "70"
      - key: LIVENESS_REQUIRED
        value: "true"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
