services:
  - type: web
    name: secureauth-ai
    runtime: node
    repo: https://github.com/your-username/your-repo
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_DEPLOYED_URL
        value: https://secureauth01.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://secureauth01.onrender.com
      - key: NEXT_PUBLIC_RP_ID
        value: secureauth01.onrender.com
      - key: NEXT_PUBLIC_ORIGIN
        value: https://secureauth01.onrender.com
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload

  - type: web
    name: secureauth-face-service
    runtime: python
    repo: https://github.com/your-username/your-repo
    rootDir: face-auth-service
    plan: free
    envVars:
      - key: FACE_SERVICE_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FACE_MATCH_THRESHOLD
        value: "70"
      - key: LIVENESS_REQUIRED
        value: "true"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
